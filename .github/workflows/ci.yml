name: MLOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        run: python src/train.py

      - name: Run tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t production-mlops-api .

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push Docker image
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHA_TAG=${GITHUB_SHA::7}

          docker tag production-mlops-api "$IMAGE_NAME:latest"
          docker tag production-mlops-api "$IMAGE_NAME:$SHA_TAG"

          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$SHA_TAG"